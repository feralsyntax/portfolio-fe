<section class="technologies" id="section-02">
  <div class="section-header">
    <span class="section-header__number">02</span>

    <h2>Technologies</h2>
  </div>

  <div class="expertise-grid">
    @for (tech of technologies; track tech.name) {
      <div class="expertise-group">
        <h3>{{ tech.name }}_</h3>

        <div class="expertise-techs">
          @for (technology of technologies.techs; track technology) {
            <span>{{ technology }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
