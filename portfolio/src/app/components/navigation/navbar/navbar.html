<nav class="navbar">
  <div class="navbar__container">
    <a
      class="navbar__brand"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      benie.dev

      <span class="navbar__brand-dot"></span>
    </a>

    <div class="navbar__links">
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
    </div>

    <button class="navbar__connect" (click)="goToContact()">Let's Connect</button>

    <button
      class="navbar__menu"
      type="button"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="material-symbols-outlined">
        {{ isMenuOpen() ? 'close' : 'menu' }}
      </span>
    </button>
  </div>

  @if (isMenuOpen()) {
    <div class="navbar__mobile-menu">
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()"> Projects </a>

      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"> About </a>

      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"> Let's Connect </a>
    </div>
  }
</nav>
